name: Keep Streamlit app awake

on:
  schedule:
    # Once an hour, offset from :00 to avoid GitHub's top-of-hour
    # scheduling congestion. 6-hourly wasn't frequent enough to keep
    # Streamlit Community Cloud's free tier from sleeping.
    - cron: "7 */1 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app to prevent it from sleeping
        run: |
          curl -sSL -c cookies.txt -b cookies.txt \
            -A "Mozilla/5.0 (compatible; KeepAwakeBot/1.0)" \
            -o /dev/null -w "HTTP %{http_code}\n" \
            "https://saas-sentiment-analyzer.streamlit.app/"
